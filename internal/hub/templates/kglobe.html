{{define "kglobe.html"}}
{{/* 点阵地球的加载与初始化。空节点列表也绘制地球，待新节点接入后再显示点位。

     脚本顺序有讲究：globe.js 必须**先**执行完，下面的初始化才能拿到
     window.KokoroGlobe。所以不能用 defer —— 内联脚本在解析时就跑，
     而 defer 的脚本要等解析完，反而会晚一步。 */}}
<script src="/static/globe.js?v=88"></script>
<script>
(function () {
  'use strict';

  var host = document.getElementById('globe');
  var dataEl = document.getElementById('globe-data');
  if (!host || !dataEl || !window.KokoroGlobe) return;

  var data;
  try {
    data = JSON.parse(dataEl.textContent);
  } catch (e) {
    return;
  }
  if (!data || !Array.isArray(data.places)) return;

  // Decorative text is generated once. CSS moves identical repeated halves
  // upward, keeping the loop seamless without a timer or animation JS loop.
  if (document.body.getAttribute('data-k-globe-backdrop') === 'matrix' && host.parentElement.classList.contains('globe-body')) {
    var matrix = document.createElement('div');
    matrix.className = 'theme-matrix';
    matrix.setAttribute('aria-hidden', 'true');
    var glyphMode = document.body.getAttribute('data-k-globe-matrix-glyphs') || 'mixed';
    var alphabets = {
      numeric: '0123456789',
      binary: '01',
      hex: '0123456789ABCDEF',
      katakana: 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ',
      mixed: '0123456789ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ'
    };
    var alphabet = alphabets[glyphMode] || alphabets.mixed;
    var matrixStyle = getComputedStyle(document.documentElement);
    var density = Math.max(8, Math.min(64, parseInt(matrixStyle.getPropertyValue('--kokoro-globe-matrix-density'), 10) || 24));
    var speed = Math.max(.25, Math.min(3, parseFloat(matrixStyle.getPropertyValue('--kokoro-globe-matrix-speed')) || 1));
    matrix.style.opacity = String(Math.max(0, Math.min(1, parseFloat(matrixStyle.getPropertyValue('--kokoro-globe-matrix-opacity')) || 0)));
    for (var column = 0; column < density; column++) {
      var strip = document.createElement('span');
      strip.className = 'matrix-column';
      var glyphs = [];
      for (var row = 0; row < 32; row++) {
        glyphs.push(alphabet.charAt(Math.floor(Math.random() * alphabet.length)));
      }
      var run = glyphs.join('\n') + '\n';
      strip.textContent = run + run.trimEnd();
      var duration = (16 + (column * 7 % 19)) / speed;
      strip.style.left = (1 + column * 97 / density) + '%';
      strip.style.animationDuration = duration + 's';
      strip.style.animationDelay = -(column * 11 % duration) + 's';
      strip.style.opacity = String(.58 + (column * 5 % 7) * .05);
      matrix.appendChild(strip);
    }
    host.parentElement.insertBefore(matrix, host);
  }

  function cssVar(el, name, fb) {
    var v = getComputedStyle(el).getPropertyValue(name).trim();
    return v || fb;
  }

  function colorVar(el, name, fb) {
    var probe = document.createElement('span');
    probe.style.color = cssVar(el, name, fb);
    probe.style.display = 'none';
    el.appendChild(probe);
    var value = getComputedStyle(probe).color || fb;
    probe.parentNode.removeChild(probe);
    return value;
  }

  function numberVar(el, name, fb, min, max) {
    var value = parseFloat(cssVar(el, name, String(fb)));
    if (!isFinite(value)) value = fb;
    return Math.max(min, Math.min(max, value));
  }

  var root = document.documentElement;
  var effects = {
    showRoutes: document.body.getAttribute('data-k-globe-routes') !== '0',
    showFlow: document.body.getAttribute('data-k-globe-flow') !== '0',
    autoRotate: document.body.getAttribute('data-k-globe-rotate') !== '0',
    routeOpacity: numberVar(root, '--kokoro-globe-route-opacity', .38, 0, 1),
    routeMutedOpacity: numberVar(root, '--kokoro-globe-route-muted-opacity', .17, 0, 1),
    routeWidth: numberVar(root, '--kokoro-globe-route-width', .85, .2, 6),
    routeUnderlayOpacity: numberVar(root, '--kokoro-globe-route-underlay-opacity', .10, 0, 1),
    routeUnderlayWidth: numberVar(root, '--kokoro-globe-route-underlay-width', 2.8, .2, 12),
    flowPeriod: numberVar(root, '--kokoro-globe-flow-period', 6100, 1000, 30000),
    flowLength: numberVar(root, '--kokoro-globe-flow-length', .23, .03, .5),
    flowOpacity: numberVar(root, '--kokoro-globe-flow-opacity', 1, 0, 1),
    flowGlow: numberVar(root, '--kokoro-globe-flow-glow', 7, 0, 20),
    flowGlowWidth: numberVar(root, '--kokoro-globe-flow-glow-width', 4.2, .2, 16),
    flowCoreWidth: numberVar(root, '--kokoro-globe-flow-core-width', 1.9, .2, 8),
    flowHeadSize: numberVar(root, '--kokoro-globe-flow-head-size', 2.25, .5, 12),
    flowGlintSize: numberVar(root, '--kokoro-globe-flow-glint-size', 1.25, .2, 8),
    flowPulseWindow: numberVar(root, '--kokoro-globe-flow-pulse-window', 1800, 100, 10000),
    nodeSize: numberVar(root, '--kokoro-globe-node-size', 2.1, .5, 8),
    nodeMutedSize: numberVar(root, '--kokoro-globe-node-muted-size', 1.7, .5, 8),
    nodeRingSize: numberVar(root, '--kokoro-globe-node-ring-size', 3.4, .5, 10),
    nodeMutedRingSize: numberVar(root, '--kokoro-globe-node-muted-ring-size', 2.8, .5, 10),
    nodeHaloSize: numberVar(root, '--kokoro-globe-node-halo-size', 6.2, 1, 20),
    hubSize: numberVar(root, '--kokoro-globe-hub-size', 2.1, .5, 8),
    hubRingSize: numberVar(root, '--kokoro-globe-hub-ring-size', 5, .5, 12),
    hubRingWidth: numberVar(root, '--kokoro-globe-hub-ring-width', 1.5, .2, 6),
    rotationSpeed: numberVar(root, '--kokoro-globe-rotation-speed', 1, 0, 5)
  };

  var g = new KokoroGlobe(host, {
    landUrl: host.getAttribute('data-land') || '/static/land.bin',
    hub: data.hasHub ? data.hub : null,
    places: data.places,
    // 点亮区域：服务端把"有节点的国家"折算成格子 run，前端据此给
    // 陆地纹理染色 —— 于是地球上那片国家是亮的，而不是只有一个点。
    litRuns: data.litRuns || '',
    effects: effects,
    colors: function () {
      var el = document.documentElement;
      return {
        day:   colorVar(el, '--globe-day', '#93a4bd'),
        night: colorVar(el, '--globe-night', '#3b465c'),
        oceanDay:   colorVar(el, '--globe-ocean-day', '#e8f0fa'),
        oceanNight: colorVar(el, '--globe-ocean-night', '#c6d3e6'),
        arc:   colorVar(el, '--kokoro-globe-route', '#2f6feb'),
        flow:  colorVar(el, '--kokoro-globe-flow', '#2f6feb'),
        // 光头直接用主题的流光色；不再读取偏白的 flow-core 变量。
        flowCore: colorVar(el, '--kokoro-globe-flow', '#2f6feb'),
        // Area fills can be softer than moving flow particles. Existing themes
        // retain their flow color unless they explicitly provide an area palette.
        litDay:   colorVar(el, '--kokoro-globe-lit-day', colorVar(el, '--kokoro-globe-flow', '#dfbd74')),
        litNight: colorVar(el, '--kokoro-globe-lit-night', colorVar(el, '--kokoro-globe-flow', '#dfbd74')),
        hub:   colorVar(document.body, '--kokoro-globe-hub', colorVar(el, '--kokoro-globe-route', '#2f6feb')),
        ok:    colorVar(el, '--kokoro-globe-node-online', '#1a7f37'),
        off:   colorVar(el, '--kokoro-globe-node-offline', '#8b949e'),
        rim:   colorVar(el, '--globe-rim', 'rgba(47,111,235,.20)')
      };
    }
  });

  // 暴露给 app.js 的 SSE 处理器：agent 每上报一次，对应航线上跑一个脉冲。
  // 这比"自己定时假脉冲"诚实——看到的光点就是真的数据到达。
  window.kokoroGlobe = g;
  var body = host.closest('.globe-body');
  var nodeList = body ? body.querySelector('.globe-node-list') : null;
  var scrollbar = body ? body.querySelector('.globe-scrollbar') : null;
  var scrollThumb = scrollbar ? scrollbar.firstElementChild : null;

  // 原生滚动条在手机上不拖动会淡出；用常驻滑块同步列表位置，
  // 只要内容可滚动就一直显示，不自动隐藏。
  function syncNodeScrollbar() {
    if (!nodeList || !scrollbar || !scrollThumb) return;
    var scrollable = nodeList.scrollHeight > nodeList.clientHeight + 1;
    scrollbar.classList.toggle('is-scrollable', scrollable);
    if (!scrollable) return;
    var track = scrollbar.clientHeight;
    var thumb = Math.max(24, track * nodeList.clientHeight / nodeList.scrollHeight);
    var maxScroll = nodeList.scrollHeight - nodeList.clientHeight;
    var maxTop = Math.max(0, track - thumb);
    var top = maxScroll > 0 ? (nodeList.scrollTop / maxScroll) * maxTop : 0;
    scrollThumb.style.height = thumb + 'px';
    scrollThumb.style.transform = 'translateY(' + top + 'px)';
  }
  if (nodeList) {
    nodeList.addEventListener('scroll', syncNodeScrollbar, { passive: true });
    if (window.ResizeObserver) new ResizeObserver(syncNodeScrollbar).observe(nodeList);
    if (window.MutationObserver) new MutationObserver(syncNodeScrollbar).observe(nodeList, { childList: true });
    window.addEventListener('resize', syncNodeScrollbar);
  }

  var buttons = document.querySelectorAll('[data-globe-mode]');
  function setMode(mode) {
    mode = mode === 'list' ? 'list' : 'labels';
    if (body) body.dataset.globeView = mode;
    buttons.forEach(function(button) { button.setAttribute('aria-pressed',String(button.dataset.globeMode === mode)); });
    g.setLabelMode(mode);
    syncNodeScrollbar();
    try { localStorage.setItem('kokoro-globe-mode', mode); } catch(e) {}
  }
  var savedMode = 'labels';
  try { savedMode = localStorage.getItem('kokoro-globe-mode') || 'labels'; } catch(e) {}
  setMode(savedMode);
  buttons.forEach(function(button) { button.addEventListener('click',function(){ setMode(button.dataset.globeMode); }); });
})();
</script>
{{end}}
