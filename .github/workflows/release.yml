name: Release Kokoro Hub and Agent

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          node --check internal/hub/static/app.js
          node --check internal/hub/static/globe.js
          node scripts/check-chart-rendering.cjs
          node scripts/check-dialog-sending.cjs
          bash -n scripts/install-hub.sh scripts/install.sh scripts/kokoro-bench.sh

      - name: Build Linux releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for arch in amd64 arm64; do
            asset="kokoro-linux-${arch}"
            agent_asset="kokoro-agent-linux-${arch}"
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" \
              -o "release/${asset}" ./cmd/kokoro
            (cd release && sha256sum "$asset" > "${asset}.sha256")
            cp "release/${asset}" "release/${agent_asset}"
            (cd release && sha256sum "$agent_asset" > "${agent_asset}.sha256")
          done
          cp scripts/install.sh scripts/kokoro-bench.sh release/
          sed -i "s|^GH_TAG=.*|GH_TAG=\"\${GH_TAG:-${GITHUB_REF_NAME}}\"|" release/install.sh
          grep -Fqx "GH_TAG=\"\${GH_TAG:-${GITHUB_REF_NAME}}\"" release/install.sh
          bash -n release/install.sh
          expected_bench_sha="$(sed -nE 's/^const testToolSHA256 = "([0-9a-f]{64})"$/\1/p' internal/agent/test_command.go)"
          actual_bench_sha="$(sha256sum release/kokoro-bench.sh | awk '{print $1}')"
          [[ -n "$expected_bench_sha" && "$actual_bench_sha" == "$expected_bench_sha" ]]
          (cd release && sha256sum install.sh > install.sh.sha256)
          (cd release && sha256sum kokoro-bench.sh > kokoro-bench.sh.sha256)
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 12

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=("$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
